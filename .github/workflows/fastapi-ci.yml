name: FastAPI Shop API CI

on:
  push:
    branches: [main]
    paths:
      - "my-fastapi-app/**"
      - ".github/workflows/fastapi-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "my-fastapi-app/**"
      - ".github/workflows/fastapi-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Automatically runs all 'run:' steps inside the 'my-fastapi-app' subfolder!
    defaults:
      run:
        working-directory: my-fastapi-app

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: shop_test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U admin -d shop_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://admin:secretpassword@localhost:5433/shop_test_db
      TEST_DATABASE_URL: postgresql+psycopg://admin:secretpassword@localhost:5433/shop_test_db
      ADMIN_API_KEY: ci-test-secret-key

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Install uv and restore cache
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          working-directory: my-fastapi-app  # Finds my-fastapi-app/uv.lock for caching!

      - name: Install project dependencies
        run: uv sync --locked --dev

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .
      - name: Run pytest test suite
        run: uv run python -m pytest -v
