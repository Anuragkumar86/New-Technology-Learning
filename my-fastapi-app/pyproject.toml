[project]
name = "my-fastapi-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anurag kumar", email = "Anuragkr8651@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.9",
    "sqlmodel>=0.0.50",
]

[project.scripts]
my-fastapi-app = "my_fastapi_app:main"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"


[tool.ruff]
# Match your Docker container's Python version so 'UP' rules use modern 3.12 syntax
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Enable: Style (E/W), Logic Bugs (F), Import Sorting (I), Python Traps (B), Modern Syntax (UP)
select = ["E", "W", "F", "I", "B", "UP"]

# Ignore E501 (line too long) in lint because 'ruff format' handles line wrapping automatically!
# Ignore B008 because FastAPI's 'Depends(get_db)' inside function defaults is completely normal!
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"